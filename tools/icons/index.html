<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Line icons (2026 set) | Careers</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/styles/fonts.css">
  <link id="theme-css" rel="stylesheet" href="/styles/themes/bsc/bsc.css">
  <style>
    body { display: block; padding: 24px; }
    .gallery-bar { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 24px; }
    .gallery-bar label { display: flex; gap: 8px; align-items: center; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; list-style: none; padding: 0; }
    .gallery li { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; border: 1px solid var(--color-border-subtle); text-align: center; }
    .gallery li.link { color: var(--color-link); }
    .gallery code { font-size: 12px; color: var(--color-text); word-break: break-word; }
    .gallery .icon.big { --icon-size: 48px; }
    .gallery-dark { background: var(--color-band); color: var(--color-on-band); }
    .gallery-dark code { color: var(--color-on-band); }
  </style>
</head>
<body class="bsc">
  <main>
    <h1>Line icons (2026 set)</h1>
    <p>159 icons. Authors insert one as <code>:name:</code>. Icons take the text colour, so the brand theme colours them.</p>
    <div class="gallery-bar">
      <label>Brand
        <select id="brand">
          <option value="bsc">Blue Shield</option>
          <option value="stellarus">Stellarus</option>
          <option value="ascendiun">Ascendiun</option>
        </select>
      </label>
      <label><input id="colour" type="checkbox"> Link colour</label>
      <label><input id="dark" type="checkbox"> On the dark band</label>
      <label>Filter <input id="filter" type="search" placeholder="name"></label>
    </div>
    <ul class="gallery" id="gallery"></ul>
  </main>
  <script type="module">
    const NAMES = ["achievement-trophy", "add-circle", "add-person", "add-person-outline", "add-user", "adhesive-bandage", "adjustment-sliders", "airplane", "alert-circle", "alphabet-book", "analytics-chart", "apple-fruit", "attachment-paperclip", "baby-stroller", "banana-fruit", "bank-building", "blank-document", "bookmark", "bookmarked-book", "brain-health", "calculator", "calendar", "california-state", "camera", "capsule-pill", "car", "chat-message", "chat-message-dots", "chatbot", "checkmark", "chess-rook", "clock", "close-circle", "cloud-upload", "community-support", "compassionate-care", "computer-monitor", "credit-card", "currency-dollar", "customer-profile", "delete-trash", "dental-care-glasses", "desktop-mobile-devices", "document-checklist", "document-search", "download", "ear", "eco-sustainability", "edit-pencil", "email", "email-at", "email-envelope", "employment-document", "eyeglasses", "face-mask", "favorite-star", "first-aid-kit", "fitness-running", "folder", "form-checklist", "globe", "graduation-cap", "handshake", "health-insurance-plan", "health-insurance-shield", "health-savings-piggy-bank", "hearing-aid", "heart", "heart-add", "heart-check", "heart-rate", "help-circle", "help-question", "home", "home-medical", "honeycomb-network", "hospital", "hourglass", "identification-card", "identity-card", "info-circle", "key", "laptop", "lightbulb", "location-pin", "logout", "lotus-wellness", "map-pin", "medical-emergency", "medical-laptop", "medical-location-cross", "medical-location-pin", "medical-mobile-app", "medical-record", "medical-refresh", "medical-shield", "medical-stethoscope", "medicine-bottle", "menu-list", "microphone", "mobile-alert", "mobile-app", "money-card", "more-options", "notification-bell", "nurse", "organization-chart", "payment-document", "pdf-document", "people-community", "pharmacy", "phone", "play", "policy-document", "prescription", "printer", "prohibited", "refresh", "save-file", "secure-lock", "settings-gear", "shopping-bag", "shopping-basket", "shopping-cart", "signature-document", "smartphone", "smile-face", "speedometer", "spreadsheet", "stethoscope", "storage-box", "success-circle", "sunrise", "syringe", "tag", "task-clipboard", "text-document", "text-size", "thermometer", "thumbs-down", "thumbs-up", "ticket", "tools-wrench", "tooth", "united-states-map", "upload", "usb-drive", "user-profile", "vector-pen-tool", "video-camera", "video-play", "view-eye", "virus", "volume-speaker", "walking-shoe", "warning-alert", "wheelchair-accessibility", "wireless-phone", "yin-yang"];
    const list = document.getElementById('gallery');
    const icon = (name, big) => `<span class="icon icon-line icon-${name}${big ? ' big' : ''}" style="--icon-image:url('/icons/${name}.svg')"><img src="/icons/${name}.svg" alt="" width="16" height="16"></span>`;
    list.innerHTML = NAMES.map((n) => `<li data-name="${n}">${icon(n)}${icon(n, true)}<code>:${n}:</code></li>`).join('');
    document.getElementById('brand').addEventListener('change', (e) => {
      document.body.className = e.target.value;
      document.getElementById('theme-css').href = `/styles/themes/${e.target.value}/${e.target.value}.css`;
    });
    document.getElementById('colour').addEventListener('change', (e) => list.querySelectorAll('li').forEach((li) => li.classList.toggle('link', e.target.checked)));
    document.getElementById('dark').addEventListener('change', (e) => list.classList.toggle('gallery-dark', e.target.checked));
    document.getElementById('filter').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      list.querySelectorAll('li').forEach((li) => { li.hidden = q && !li.dataset.name.includes(q); });
    });
  </script>
</body>
</html>
