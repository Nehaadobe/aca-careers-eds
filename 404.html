<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <!--
    A 404 has no page metadata, so the site's /metadata row for /** (theme, analytics, consent, nav,
    footer) is applied first: every brand site shows its own theme, header and footer on any domain.
    When the site has an authored /fragments/errors/404, it replaces the default content below.
  -->
  <script nonce="aem" type="module">
    try {
      const resp = await fetch('/metadata.json');
      if (resp.ok) {
        const { data = [] } = await resp.json();
        const site = data.find((row) => row.URL === '/**') || {};
        Object.entries(site).forEach(([name, value]) => {
          if (name === 'URL' || !value || document.head.querySelector(`meta[name="${name.toLowerCase()}"]`)) return;
          const meta = document.createElement('meta');
          meta.name = name.toLowerCase();
          meta.content = value;
          document.head.append(meta);
        });
      }
    } catch (e) {
      // no metadata: the page code falls back to the site name in the host
    }
    try {
      const resp = await fetch('/fragments/errors/404.plain.html');
      if (resp.ok) {
        document.querySelector('main.error').innerHTML = '<div><div class="fragment"><div><div>'
          + '<a href="/fragments/errors/404">/fragments/errors/404</a></div></div></div></div>';
      }
    } catch (e) {
      // no authored 404: keep the default content
    }
    await import('/scripts/scripts.js');
  </script>
  <script nonce="aem" type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('button', 'error-button-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('main.error .button-container');
          if (btnContainer) btnContainer.append(backBtn);
        }
      }
    });
  </script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
    }

    /* the flex layout centres the message vertically; the section stays full width so the
       content lines up with the header, like on every other page */
    main.error > .section {
      width: 100%;
    }

    main.error .error-number {
      width: 300px;
      max-width: 100%;
    }

    main.error .error-number text {
      font-family: var(--font-mono);
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <svg viewBox="1 0 38 18" class="error-number">
        <text x="0" y="17">404</text>
      </svg>
      <h2 class="error-message">Page Not Found</h2>
      <p class="button-container">
        <a href="/" class="button secondary error-button-home">Go home</a>
      </p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
